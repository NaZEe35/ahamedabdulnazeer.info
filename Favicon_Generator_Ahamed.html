<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<title>Favicon Generator - Ahamed Abdul Nazeer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0c1526;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    min-height: 100vh; font-family: Arial, sans-serif;
    gap: 32px; padding: 40px 0;
  }
  h2 { color: #5A8AD4; font-size: 13px; letter-spacing: 3px; text-transform: uppercase; }
  .previews {
    display: flex; align-items: flex-end;
    gap: 32px; flex-wrap: wrap; justify-content: center;
  }
  .preview-box { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .preview-box span { color: #3A5A8A; font-size: 11px; letter-spacing: 1px; }
  canvas { border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
  .buttons { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
  .dl-btn {
    padding: 11px 28px; background: #111D38;
    color: #7AAAE4; border: 1px solid #2A4A7A;
    border-radius: 8px; font-size: 12px; font-weight: 600;
    cursor: pointer; letter-spacing: 1px; transition: all 0.2s;
  }
  .dl-btn:hover { background: #5A8AD4; color: white; border-color: #5A8AD4; }
  .dl-btn.primary { background: #5A8AD4; color: white; border-color: #5A8AD4; font-size: 13px; padding: 13px 36px; }
  .dl-btn.primary:hover { background: #7AAAE4; }
  .note {
    color: #2A4A6A; font-size: 11px; text-align: center;
    max-width: 420px; line-height: 1.8; letter-spacing: 0.3px;
  }
  .tab-preview {
    background: #1a2a44; border-radius: 10px 10px 0 0;
    padding: 10px 20px; display: flex; align-items: center;
    gap: 8px; border: 1px solid #2A4A6A; border-bottom: none;
    width: 220px;
  }
  .tab-preview img { width: 16px; height: 16px; border-radius: 3px; }
  .tab-preview span { color: #A8C4E8; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tab-bar { background: #111D38; height: 4px; width: 100%; max-width: 400px; border-radius: 0 4px 0 0; }
</style>
</head>
<body>

<h2>Favicon — Browser Tab Icon</h2>

<!-- Live tab preview -->
<div style="display:flex;flex-direction:column;align-items:flex-start;">
  <div class="tab-preview">
    <canvas id="tab16" width="16" height="16" style="border-radius:2px;box-shadow:none;"></canvas>
    <span>Ahamed Abdul Nazeer | IT Engineer</span>
  </div>
  <div class="tab-bar"></div>
</div>

<!-- Size previews -->
<div class="previews">
  <div class="preview-box"><canvas id="cv512" width="512" height="512"></canvas><span>512 × 512</span></div>
  <div class="preview-box"><canvas id="cv192" width="192" height="192"></canvas><span>192 × 192</span></div>
  <div class="preview-box"><canvas id="cv64"  width="64"  height="64" ></canvas><span>64 × 64</span></div>
  <div class="preview-box"><canvas id="cv32"  width="32"  height="32" ></canvas><span>32 × 32</span></div>
</div>

<!-- Download buttons -->
<div class="buttons">
  <button class="dl-btn primary" onclick="dl('cv512','favicon-512.png')">⬇ 512px (PWA)</button>
  <button class="dl-btn" onclick="dl('cv192','favicon-192.png')">⬇ 192px (Android)</button>
  <button class="dl-btn" onclick="dl('cv64','favicon-64.png')">⬇ 64px</button>
  <button class="dl-btn" onclick="dl('cv32','favicon-32.png')">⬇ 32px (favicon)</button>
  <button class="dl-btn" onclick="dl('cv16b','favicon-16.png')">⬇ 16px (tab)</button>
  <button class="dl-btn" onclick="dlSvg()">⬇ SVG (scalable)</button>
</div>

<div class="note">
  Add to your repo root as <code style="color:#5A8AD4">favicon.ico</code> or use the link tags below ↓<br><br>
  <code style="color:#3A7A5A">&lt;link rel="icon" href="favicon-32.png" sizes="32x32"&gt;</code><br>
  <code style="color:#3A7A5A">&lt;link rel="apple-touch-icon" href="favicon-192.png"&gt;</code>
</div>

<!-- Hidden 16px canvas for tab preview -->
<canvas id="cv16b" width="16" height="16" style="display:none;"></canvas>

<script>
function drawIcon(canvas, size) {
  const c = canvas.getContext('2d');
  const s = size;
  const r = s * 0.18; // corner radius

  c.clearRect(0, 0, s, s);

  // ── BACKGROUND ──
  const bg = c.createLinearGradient(0, 0, s, s);
  bg.addColorStop(0, '#111D38');
  bg.addColorStop(1, '#1A2D54');
  c.fillStyle = bg;
  c.beginPath();
  c.roundRect(0, 0, s, s, r);
  c.fill();

  // ── OUTER GLOW RING ──
  const glowGrad = c.createLinearGradient(0, 0, s, s);
  glowGrad.addColorStop(0, 'rgba(90,138,212,0.5)');
  glowGrad.addColorStop(1, 'rgba(122,170,228,0.2)');
  c.strokeStyle = glowGrad;
  c.lineWidth = s * 0.035;
  c.beginPath();
  c.roundRect(s*0.035, s*0.035, s*0.93, s*0.93, r * 0.85);
  c.stroke();

  // ── INNER CIRCLE (blue accent) ──
  if (s >= 32) {
    c.beginPath();
    c.arc(s * 0.5, s * 0.5, s * 0.35, 0, Math.PI * 2);
    c.strokeStyle = 'rgba(90,138,212,0.15)';
    c.lineWidth = s * 0.018;
    c.stroke();
  }

  // ── LETTERS "AN" ──
  c.textAlign = 'center';
  c.textBaseline = 'middle';

  if (s >= 64) {
    // Two-letter version for larger sizes
    c.font = `700 ${s * 0.42}px Georgia, serif`;
    c.fillStyle = '#FFFFFF';
    c.fillText('A', s * 0.34, s * 0.46);

    c.font = `700 ${s * 0.42}px Georgia, serif`;

    // Blue N
    const grad = c.createLinearGradient(0, 0, s, s);
    grad.addColorStop(0, '#5A8AD4');
    grad.addColorStop(1, '#7AAAE4');
    c.fillStyle = grad;
    c.fillText('N', s * 0.66, s * 0.54);

    // Dot accent
    if (s >= 128) {
      c.beginPath();
      c.arc(s * 0.5, s * 0.82, s * 0.04, 0, Math.PI * 2);
      c.fillStyle = '#5A8AD4';
      c.fill();
    }
  } else {
    // Single A for tiny sizes
    c.font = `700 ${s * 0.58}px Georgia, serif`;
    const grad = c.createLinearGradient(0, 0, s, s);
    grad.addColorStop(0, '#FFFFFF');
    grad.addColorStop(1, '#7AAAE4');
    c.fillStyle = grad;
    c.fillText('A', s * 0.5, s * 0.52);
  }

  // ── CORNER ACCENT (top-right) ──
  if (s >= 64) {
    c.fillStyle = '#5A8AD4';
    c.beginPath();
    c.arc(s * 0.82, s * 0.18, s * 0.055, 0, Math.PI * 2);
    c.fill();
  }

  c.textAlign = 'left';
  c.textBaseline = 'alphabetic';
}

const sizes = [
  { id: 'cv512', size: 512 },
  { id: 'cv192', size: 192 },
  { id: 'cv64',  size: 64  },
  { id: 'cv32',  size: 32  },
  { id: 'cv16b', size: 16  },
  { id: 'tab16', size: 16  },
];

sizes.forEach(({ id, size }) => {
  const el = document.getElementById(id);
  if (el) drawIcon(el, size);
});

function dl(id, name) {
  const a = document.createElement('a');
  a.download = name;
  a.href = document.getElementById(id).toDataURL('image/png');
  a.click();
}

function dlSvg() {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111D38"/>
      <stop offset="100%" stop-color="#1A2D54"/>
    </linearGradient>
    <linearGradient id="bl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5A8AD4"/>
      <stop offset="100%" stop-color="#7AAAE4"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="92" fill="url(#bg)"/>
  <rect x="18" y="18" width="476" height="476" rx="80" fill="none" stroke="url(#bl)" stroke-width="18" opacity="0.45"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="#5A8AD4" stroke-width="9" opacity="0.15"/>
  <text x="172" y="310" font-family="Georgia,serif" font-size="215" font-weight="700" fill="#FFFFFF">A</text>
  <text x="280" y="310" font-family="Georgia,serif" font-size="215" font-weight="700" fill="url(#bl)">N</text>
  <circle cx="420" cy="92" r="28" fill="#5A8AD4"/>
  <circle cx="256" cy="420" r="20" fill="#5A8AD4" opacity="0.8"/>
</svg>`;
  const blob = new Blob([svg], { type: 'image/svg+xml' });
  const a = document.createElement('a');
  a.download = 'favicon.svg';
  a.href = URL.createObjectURL(blob);
  a.click();
}
</script>
</body>
</html>
